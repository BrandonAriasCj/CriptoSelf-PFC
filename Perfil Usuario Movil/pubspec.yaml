name: perfil_usuario_movil
description: App móvil mínima para alertas de criptomonedas - CriptoSelf

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  # WebSocket para notificaciones en tiempo real (mismo canal que la web)
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Authentication
  google_sign_in: ^6.2.1
  
  # Local Notifications (sin Firebase)
  flutter_local_notifications: ^17.2.3
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.19.0
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  
  # UI Enhancements
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Genera los iconos del launcher (mipmaps + iconos adaptativos) desde
  # assets/icon/. Regenerar con: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Icono de la app CriptoSelf (logo de marca, no el de Flutter por defecto).
# Las imagenes fuente las genera assets/icon/generate_icon.py
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"